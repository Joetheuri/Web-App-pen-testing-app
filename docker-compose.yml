services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pentest
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER}
      APP_BASIC_AUTH_PASSWORD: ${APP_BASIC_AUTH_PASSWORD}
      PASSIVE_SCAN_ALLOWED_HOSTS: ${PASSIVE_SCAN_ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pentest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pentest"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
